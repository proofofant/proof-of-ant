# /etc/nginx/sites-available/proof-of-ant  (with a domain: set server_name, then certbot --nginx -d <domain>)
limit_req_zone $binary_remote_addr zone=rpc:10m rate=30r/s;

server {
    listen 80;
    server_name proofofant.fun www.proofofant.fun;

    location /api/rpc {
        limit_req zone=rpc burst=200 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/faucet { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
